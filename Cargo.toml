[package]
name = "high-performance-matching-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "In-memory Rust limit order book with price-time priority and partial fills"
license = "MIT"
repository = "https://github.com/0xmrpinheiro/high-performance-matching-engine"
keywords = ["order-book", "matching-engine", "limit-orders"]

[dependencies]

[dev-dependencies]
proptest = "1"
divan = "0.1"

[[bench]]
name = "matching_bench"
harness = false

[[example]]
name = "partial_fill_demo"
path = "examples/partial_fill_demo.rs"
